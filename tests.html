<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Running tests</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 1rem/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 64rem; padding: 1rem; }
    .skip { position: absolute; left: -999px; }
    .skip:focus { left: 1rem; top: 1rem; background: Canvas; padding: .5rem; }
    h1 { font-size: 1.5rem; margin-bottom: .25rem; }
    #summary { font-weight: 700; padding: .5rem .75rem; border-left: .4rem solid GrayText; }
    #summary.all-pass { border-color: #1a7f37; }
    #summary.has-fail { border-color: #c62828; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; }
    th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid GrayText; vertical-align: top; overflow-wrap: anywhere; }
    td.verdict { font-weight: 700; white-space: nowrap; }
    tr.fail td { background: color-mix(in srgb, #c62828 18%, Canvas); }
    code { font-family: ui-monospace, monospace; }
    :focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
  </style>
</head>
<body>
  <a class="skip" href="#results">Skip to results</a>
  <main>
    <h1>Campus Life Planner: test runner</h1>
    <p id="summary" role="status">Running checks...</p>
    <p><label><input type="checkbox" id="only-failures"> Show failures only</label></p>
    <div id="results"></div>
  </main>

  <script type="module">
    import * as V from "./scripts/validators.js";
    import * as S from "./scripts/storage.js";

    // ---------- the tiny assertion kit ----------
    const results = [];

    // Printable version of any input. JSON.stringify makes tabs, newlines and
    // stray spaces visible, which is the whole point when testing whitespace.
    function show(value) {
      if (typeof value === "string" && value.length > 40) {
        return JSON.stringify(value.slice(0, 37) + "...") + ` (${value.length} chars)`;
      }
      return String(JSON.stringify(value));
    }

    function check(suite, label, actual, expected) {
      const pass = JSON.stringify(actual) === JSON.stringify(expected);
      results.push({ suite, label, pass, actual, expected });
    }

    // A validator that throws must show up as a failed check, not stop the page.
    function run(fn, input) {
      try {
        return fn(input);
      } catch (error) {
        return { ok: "threw: " + error.message, value: "threw: " + error.message };
      }
    }

    const accepts = (suite, fn, inputs) =>
      inputs.forEach((i) => check(suite, `accepts ${show(i)}`, run(fn, i).ok, true));
    const rejects = (suite, fn, inputs) =>
      inputs.forEach((i) => check(suite, `rejects ${show(i)}`, run(fn, i).ok, false));
    const converts = (suite, fn, pairs) =>
      pairs.forEach(([i, out]) => check(suite, `${show(i)} becomes ${show(out)}`, run(fn, i).value, out));

    // ---------- Title ----------
    accepts("Title", V.validateTitle, [
      "Read chapter 4", "A", "x".repeat(80), "Study Study Group",
      "Lab report due 14:30", "Review 3 notes!",
    ]);
    rejects("Title", V.validateTitle, [
      "", "   ", " leading", "trailing ", "\tTabbed", "end\n", "Study\u00A0",
      "x".repeat(81), "!!!", "...", null, 42,
    ]);
    converts("Title", V.validateTitle, [
      ["Read   the    book", "Read the book"],
      ["a\t\tb", "a b"],
      ["Mon  14:30  lab", "Mon 14:30 lab"],
    ]);

    // ---------- Title warnings (advanced rule 1: back-reference) ----------
    for (const [text, count] of [
      ["the the plan", 1], ["The the plan", 1], ["Study  Study group", 1],
      ["had had enough", 1], ["the then plan", 0], ["Read the book", 0],
    ]) {
      check("Duplicate-word warning", `${show(text)} gives ${count} warning(s)`,
        V.validateTitle(text).warnings.length, count);
    }
    check("Duplicate-word warning", "a warning does not block saving",
      V.validateTitle("the the plan").ok, true);

    // ---------- Duration ----------
    accepts("Duration", V.validateDuration, [
      "1", "90", "7.5", "7.50", "10.25", "0.5", "10080", 90, 7.5,
    ]);
    rejects("Duration", V.validateDuration, [
      "0", "007", "-5", "+5", "5.", ".5", "5.123", "1e3", " 5", "5 ", "",
      "abc", "1,5", "9".repeat(30), "10081", 0.1 + 0.2, undefined, null,
    ]);
    converts("Duration", V.validateDuration, [["90", 90], ["7.50", 7.5], [90, 90]]);

    // ---------- Walk time ----------
    accepts("Walk time", V.validateWalk, ["0", "5", "120", "", 15, 0, undefined, null]);
    rejects("Walk time", V.validateWalk, ["-1", "121", "1.5", "abc", "05", "1e2", " 5", 130, -3]);
    converts("Walk time", V.validateWalk, [["", 0], ["15", 15], [undefined, 0]]);

    // ---------- Due date ----------
    accepts("Due date", V.validateDate, [
      "2026-10-08", "2024-02-29", "2000-02-29", "2000-01-01", "2100-12-31",
    ]);
    rejects("Due date", V.validateDate, [
      "2026-02-30", "2025-02-29", "2100-02-29", "2026-04-31", "2026-06-31",
      "2026-13-01", "2026-00-10", "2026-10-00", "2026-10-32", "2026-10-8",
      "10-08-2026", "2026/10/08", " 2026-10-08", "2026-10-08 ", "",
      "1899-12-31", "2101-01-01", null,
    ]);

    // ---------- Tag ----------
    accepts("Tag", V.validateTag, [
      "Academics", "Group-work", "Lab work", "A", "Self study-time",
    ]);
    rejects("Tag", V.validateTag, [
      "-Study", "Study-", "Lab  work", "Study - group", "Math101",
      "<b>x</b>", "", "   ", "Caf\u00E9", "x".repeat(41), null,
    ]);

    // ---------- Time token (advanced rule 2) ----------
    for (const [text, expected] of [
      ["Lab at 14:30", { text: "14:30", hours: 14, minutes: 30 }],
      ["Meet 09:05", { text: "09:05", hours: 9, minutes: 5 }],
      ["Closing 23:59", { text: "23:59", hours: 23, minutes: 59 }],
      ["Call at 99:99", null], ["Midnight 24:00", null], ["Bad 12:60", null],
      ["x14:30", null], ["14:305", null], ["Seminar 9:30", null], ["no time here", null],
    ]) {
      check("Time token", `${show(text)} finds ${show(expected)}`, V.findTimeToken(text), expected);
    }

    // ---------- Record id and timestamp (used by strict import) ----------
    for (const [value, expected] of [
      ["plan_0001", true], ["plan_00001", true], ["plan_1", false],
      ["PLAN_0001", false], ["plan_0001 ", false], [null, false],
    ]) {
      check("Record id", `${show(value)} is ${expected ? "valid" : "invalid"}`, V.isRecordId(value), expected);
    }
    for (const [value, expected] of [
      ["2026-10-01T10:00:00.000Z", true], ["2026-10-01", false],
      ["2026-10-01T10:00:00Z", false], ["yesterday", false], [undefined, false],
    ]) {
      check("Timestamp", `${show(value)} is ${expected ? "valid" : "invalid"}`, V.isIsoTimestamp(value), expected);
    }

    // ---------- Whole record ----------
    const good = V.validateRecord({
      title: "Study   Study Group", tag: "Academics", dueDate: "2026-10-15", duration: "90",
    });
    check("Whole record", "good input is ok", good.ok, true);
    check("Whole record", "title is cleaned", good.record.title, "Study Study Group");
    check("Whole record", "duration becomes a number", good.record.duration, 90);
    check("Whole record", "missing walk time defaults to 0", good.record.walk, 0);
    check("Whole record", "duplicate word shows up as a title warning", Boolean(good.warnings.title), true);

    const broken = V.validateRecord({
      title: " x", tag: "Math101", dueDate: "2026-02-30", duration: "abc", walk: "500",
    });
    check("Whole record", "bad input is not ok", broken.ok, false);
    check("Whole record", "errors come back in form order",
      Object.keys(broken.errors), ["title", "tag", "dueDate", "duration", "walk"]);
    check("Whole record", "null input is rejected, not thrown", run(V.validateRecord, null).ok, false);

    // ---------- Guards against shared-regex bugs ----------
    check("Guards", "PATTERNS is frozen", Object.isFrozen(V.PATTERNS), true);
    check("Guards", "no pattern uses the g or y flag",
      Object.values(V.PATTERNS).filter((re) => re.global || re.sticky).length, 0);
    for (const [name, fn, sample] of [
      ["validateTitle", V.validateTitle, "the the plan"],
      ["validateDuration", V.validateDuration, "90"],
      ["validateDate", V.validateDate, "2026-10-15"],
      ["validateTag", V.validateTag, "Group-work"],
    ]) {
      const first = JSON.stringify(fn(sample));
      const second = JSON.stringify(fn(sample));
      check("Guards", `${name} repeat calls match`, second, first);
    }

    // ---------- Storage (in-memory fakes only, never the real localStorage) ----------
    class MemoryStore {
      constructor() { this.map = new Map(); }
      getItem(key) { return this.map.has(key) ? this.map.get(key) : null; }
      setItem(key, value) { this.map.set(key, String(value)); }
      removeItem(key) { this.map.delete(key); }
    }
    class FullStore extends MemoryStore {
      setItem() {
        const error = new Error("full");
        error.name = "QuotaExceededError";
        throw error;
      }
    }

    const sample = {
      id: "plan_0001", title: "Study Study Group", duration: 90, tag: "Academics",
      dueDate: "2026-10-15", walk: 8,
      createdAt: "2026-10-01T10:00:00.000Z", updatedAt: "2026-10-01T10:00:00.000Z",
    };
    const withChange = (changes) => ({ ...sample, ...changes });
    const listOf = (...items) => JSON.stringify(items);

    // ---------- Seed file ----------
    const seedResult = await S.loadSeed();
    check("Seed file", "loads and passes strict validation", seedResult.ok, true);
    const seed = seedResult.records;
    check("Seed file", "has at least 12 records", seed.length >= 12, true);
    check("Seed file", "ids are unique", new Set(seed.map((r) => r.id)).size, seed.length);
    check("Seed file", "includes a leap-day due date", seed.some((r) => r.dueDate === "2028-02-29"), true);
    check("Seed file", "includes a year-boundary due date", seed.some((r) => r.dueDate === "2027-01-01"), true);
    check("Seed file", "includes a decimal duration", seed.some((r) => !Number.isInteger(r.duration)), true);
    check("Seed file", "includes a repeated-word title",
      seed.some((r) => V.validateTitle(r.title).warnings.length > 0), true);
    check("Seed file", "includes a title with a time token",
      seed.some((r) => V.findTimeToken(r.title) !== null), true);
    check("Seed file", "includes a title with regex special characters",
      seed.some((r) => /[()[\]+?]/.test(r.title)), true);
    check("Seed file", "includes a title with markup characters",
      seed.some((r) => r.title.includes("<b>")), true);

    // ---------- Strict import ----------
    for (const [label, text] of [
      ["text that is not JSON", "not json"],
      ["an object with no version", "{}"],
      ["a bare number", "42"],
      ["null", "null"],
      ["a non-object record", "[1]"],
      ["an unknown field", listOf(withChange({ admin: true }))],
      ["a bad id", listOf(withChange({ id: "plan_1" }))],
      ["a bad due date", listOf(withChange({ dueDate: "2026-02-30" }))],
      ["a bad tag", listOf(withChange({ tag: "Math101" }))],
      ["a bad duration", listOf(withChange({ duration: "abc" }))],
      ["a title with edge spaces", listOf(withChange({ title: " padded " }))],
      ["a missing timestamp", listOf({ ...sample, createdAt: undefined })],
      ["updatedAt before createdAt", listOf(withChange({ updatedAt: "2026-09-01T10:00:00.000Z" }))],
      ["a duplicate id", listOf(sample, sample)],
      ["an unsupported envelope version", JSON.stringify({ version: 2, records: [sample] })],
      ["an unknown envelope field", JSON.stringify({ version: 1, records: [sample], extra: 1 })],
      ["more than the record limit", JSON.stringify(Array(2001).fill(sample))],
      ["a file over the size limit", "[" + " ".repeat(1_000_001) + "]"],
    ]) {
      check("Strict import", `rejects ${label}`, S.parseRecordList(text).ok, false);
    }
    const withoutWalk = Object.fromEntries(Object.entries(sample).filter(([key]) => key !== "walk"));
    for (const [label, text] of [
      ["an empty list", "[]"],
      ["one valid record", listOf(sample)],
      ["a duration written as text", listOf(withChange({ duration: "90" }))],
      ["a record without walk time", listOf(withoutWalk)],
      ["the export envelope", JSON.stringify({
        app: "campus-life-planner", version: 1, exportedAt: "2026-10-13T08:00:00.000Z", records: [sample],
      })],
    ]) {
      check("Strict import", `accepts ${label}`, S.parseRecordList(text).ok, true);
    }
    check("Strict import", "a missing walk time defaults to 0",
      S.parseRecordList(listOf(withoutWalk)).records[0].walk, 0);
    check("Strict import", "inner double spaces in a title are collapsed",
      S.parseRecordList(listOf(withChange({ title: "Study   Study Group" }))).records[0].title, "Study Study Group");
    check("Strict import", "problems say which record is wrong",
      S.parseRecordList(listOf(sample, withChange({ id: "plan_0002", dueDate: "2026-02-30" })))
        .problems[0].includes("Record 2"), true);
    check("Strict import", "a __proto__ key is rejected as an unknown field",
      S.parseRecordList('[{"__proto__":{"admin":true},"id":"plan_0001"}]').ok, false);
    check("Strict import", "and Object.prototype stays clean", ({}).admin, undefined);

    // ---------- Saving and loading ----------
    const store = new MemoryStore();
    check("Storage", "an empty store reports empty", S.loadRecords(store).status, "empty");
    check("Storage", "saving works", S.saveRecords(seed, store).ok, true);
    const reloaded = S.loadRecords(store);
    check("Storage", "saved records load back as ok", reloaded.status, "ok");
    check("Storage", "records survive a save and load unchanged", reloaded.records, seed);
    check("Storage", "a full store reports failure instead of throwing", S.saveRecords(seed, new FullStore()).ok, false);
    check("Storage", "and the message explains why", S.saveRecords(seed, new FullStore()).message.includes("full"), true);
    check("Storage", "a missing store reports unavailable", S.loadRecords(null).status, "unavailable");
    check("Storage", "saving to a missing store fails politely", S.saveRecords(seed, null).ok, false);

    const brokenStore = new MemoryStore();
    brokenStore.setItem(S.KEYS.records, "{oops");
    check("Storage", "unreadable JSON reports corrupt", S.loadRecords(brokenStore).status, "corrupt");
    check("Storage", "a corrupt save is copied to a backup key", brokenStore.getItem(S.KEYS.backup), "{oops");
    const wrongShape = new MemoryStore();
    wrongShape.setItem(S.KEYS.records, listOf(withChange({ dueDate: "2026-02-30" })));
    check("Storage", "a record that fails validation reports corrupt", S.loadRecords(wrongShape).status, "corrupt");

    // ---------- Start-up flow ----------
    const bootStore = new MemoryStore();
    check("Boot", "first run loads the seed", (await S.bootRecords(bootStore)).source, "seed");
    check("Boot", "first run saves the seed", S.loadRecords(bootStore).status, "ok");
    check("Boot", "second run reads from storage", (await S.bootRecords(bootStore)).source, "storage");
    const bootBroken = new MemoryStore();
    bootBroken.setItem(S.KEYS.records, "{oops");
    const recovered = await S.bootRecords(bootBroken);
    check("Boot", "corrupt data falls back to the seed", recovered.source, "seed");
    check("Boot", "and says what happened", recovered.problems.length > 0, true);
    check("Boot", "and keeps the broken text as a backup", bootBroken.getItem(S.KEYS.backup), "{oops");

    // ---------- Ids and file names ----------
    for (const [list, expected] of [
      [[], "plan_0001"],
      [[{ id: "plan_0009" }], "plan_0010"],
      [[{ id: "plan_0002" }, { id: "plan_0010" }], "plan_0011"],
      [[{ id: "plan_9999" }], "plan_10000"],
      [[{ id: "junk" }], "plan_0001"],
    ]) {
      check("Ids and names", `${show(list.map((r) => r.id))} next is ${expected}`, S.nextRecordId(list), expected);
    }
    check("Ids and names", "export file name uses the local date",
      S.exportFileName("json", new Date(2026, 9, 5)), "campus-life-planner-2026-10-05.json");

    // ---------- JSON export ----------
    check("JSON export", "imports back unchanged",
      S.parseRecordList(S.exportJSON(seed, new Date("2026-10-13T08:00:00.000Z"))).records, seed);
    check("JSON export", "is an envelope with a version", JSON.parse(S.exportJSON(seed)).version, 1);

    // ---------- CSV export ----------
    for (const [input, expected] of [
      ["plain", "plain"], ["a,b", '"a,b"'], ['say "hi"', '"say ""hi"""'],
      ["line1\nline2", '"line1\nline2"'], ["=SUM(A1)", "'=SUM(A1)"],
      ["+1 call", "'+1 call"], ["-5 degrees", "'-5 degrees"], ["@home", "'@home"],
      [90, "90"], [7.5, "7.5"], [null, ""],
    ]) {
      check("CSV export", `${show(input)} becomes ${show(expected)}`, S.csvCell(input), expected);
    }
    const csv = S.exportCSV(seed);
    const csvLines = csv.slice(1).split("\r\n");
    check("CSV export", "starts with a byte order mark", csv.charCodeAt(0), 0xfeff);
    check("CSV export", "header row matches the model", csvLines[0],
      "id,title,duration,tag,dueDate,walk,createdAt,updatedAt");
    check("CSV export", "has one line per record plus the header", csvLines.length - 1, seed.length + 1);
    check("CSV export", "quotes a title that holds commas", csv.includes('"Project standup, room B2, 09:15"'), true);
    check("CSV export", "doubles quotes inside a title", csv.includes('"Budget check: ""airtime"" and transport"'), true);

    // ---------- Settings ----------
    check("Settings", "empty input gives the defaults", S.validateSettings({}), S.DEFAULT_SETTINGS);
    check("Settings", "null input gives the defaults", S.validateSettings(null), S.DEFAULT_SETTINGS);
    for (const [input, field, expected] of [
      [{ capMinutes: "1200" }, "capMinutes", 1200],
      [{ capMinutes: -5 }, "capMinutes", 0],
      [{ capMinutes: 99999 }, "capMinutes", 0],
      [{ capMinutes: 12.5 }, "capMinutes", 0],
      [{ theme: "neon" }, "theme", "system"],
      [{ theme: "dark" }, "theme", "dark"],
      [{ units: "hours" }, "units", "hours"],
      [{ units: "days" }, "units", "minutes"],
      [{ rate: 90 }, "rate", 90],
      [{ rate: 0 }, "rate", 60],
      [{ urgentHours: "72" }, "urgentHours", 72],
      [{ buffer: 31 }, "buffer", 5],
      [{ stressMode: "yes" }, "stressMode", false],
      [{ stressMode: true }, "stressMode", true],
    ]) {
      check("Settings", `${show(input)} gives ${field} ${show(expected)}`, S.validateSettings(input)[field], expected);
    }
    const settingsStore = new MemoryStore();
    S.saveSettings({ theme: "dark", capMinutes: 1200 }, settingsStore);
    check("Settings", "survive a save and load", S.loadSettings(settingsStore).capMinutes, 1200);
    settingsStore.setItem(S.KEYS.settings, "{oops");
    check("Settings", "corrupt saved settings fall back to defaults", S.loadSettings(settingsStore), S.DEFAULT_SETTINGS);

    // ---------- Clear all ----------
    const clearStore = new MemoryStore();
    S.saveRecords(seed, clearStore);
    S.saveSettings({ theme: "dark" }, clearStore);
    clearStore.setItem(S.KEYS.backup, "old text");
    S.clearAllData(clearStore);
    check("Clear all", "removes records", clearStore.getItem(S.KEYS.records), null);
    check("Clear all", "removes settings", clearStore.getItem(S.KEYS.settings), null);
    check("Clear all", "removes the backup", clearStore.getItem(S.KEYS.backup), null);

    // ---------- Rendering (textContent only, so toxic inputs stay inert text) ----------
    const make = (tag, text) => {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      return node;
    };

    function render() {
      const mount = document.getElementById("results");
      const onlyFailures = document.getElementById("only-failures").checked;
      mount.replaceChildren();
      const suites = [...new Set(results.map((r) => r.suite))];
      suites.forEach((name, index) => {
        const rows = results.filter((r) => r.suite === name && (!onlyFailures || !r.pass));
        if (rows.length === 0) return;
        const heading = make("h2", name);
        heading.id = `suite-${index}`;
        const table = make("table");
        table.setAttribute("aria-labelledby", heading.id);
        const head = make("tr");
        ["Result", "Check", "Expected", "Got"].forEach((label) => {
          const th = make("th", label);
          th.setAttribute("scope", "col");
          head.append(th);
        });
        const thead = make("thead");
        thead.append(head);
        const tbody = make("tbody");
        rows.forEach((r) => {
          const tr = make("tr");
          if (!r.pass) tr.className = "fail";
          const verdict = make("td", r.pass ? "PASS" : "FAIL");
          verdict.className = "verdict";
          tr.append(verdict, make("td", r.label), make("td", show(r.expected)), make("td", show(r.actual)));
          tbody.append(tr);
        });
        table.append(thead, tbody);
        mount.append(heading, table);
      });
    }

    const failed = results.filter((r) => !r.pass).length;
    const summary = document.getElementById("summary");
    summary.textContent = failed === 0
      ? `All ${results.length} checks passed.`
      : `${failed} of ${results.length} checks failed. Failures are highlighted below.`;
    summary.className = failed === 0 ? "all-pass" : "has-fail";
    document.title = `${failed === 0 ? "PASS" : "FAIL"} (${results.length - failed}/${results.length}) Tests`;

    document.getElementById("only-failures").addEventListener("change", render);
    render();
  </script>
</body>
</html>
